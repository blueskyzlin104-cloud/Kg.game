<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🦄</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');
        * { box-sizing: border-box; font-family: 'Padauk', sans-serif; margin: 0; padding: 0; user-select: none; }
        
        html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(-45deg, #00c6ff, #0072ff, #38ef7d, #11998e); background-size: 400% 400%; animation: gradientBG 10s ease infinite; display: flex; flex-direction: column; align-items: center; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 🔝 Top Nav */
        .top-nav { width: 95%; max-width: 500px; padding: 10px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); border-radius: 20px; text-align: center; color: white; margin-top: 10px; }
        .mode-box { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
        .btn-m { padding: 4px 8px; border-radius: 10px; border: none; font-size: 12px; cursor: pointer; color: white; }
        .btn-restart { padding: 4px 10px; border-radius: 10px; border: none; font-size: 12px; cursor: pointer; background: #ff7675; color: white; }
        .bg-mm { background: #ff4757; } .bg-en { background: #2ed573; } .bg-num { background: #1e90ff; }

        /* 🎥 Character Box */
        .character-box { width: 85vw; height: 30vh; max-width: 350px; background: white; border-radius: 20px; overflow: hidden; margin: 10px 0; display: flex; align-items: center; justify-content: center; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .character-box img, .character-box video { width: 100%; height: 100%; object-fit: cover; }

        /* 🃏 3D Card Flip */
        .card-container { perspective: 1000px; width: 250px; height: 150px; margin: 10px 0; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 70px; font-weight: bold; border: 5px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card-front { background: #f1c40f; color: white; }
        .card-back { background: white; color: #e74c3c; transform: rotateY(180deg); }

        /* 🕹️ Controls */
        .btn-draw { padding: 12px 30px; background: #ff7675; border: none; border-radius: 50px; color: white; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #d63031; }
        .eval-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-eval { padding: 12px 25px; border-radius: 20px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        .btn-yes { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
        .btn-no { background: #ff9f43; box-shadow: 0 4px 0 #e67e22; }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1>🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်း 🦄</h1>
        <div style="display: flex; justify-content: center; gap: 10px; align-items: center;">
            <div id="starCount">⭐ ကြယ်: 0</div>
            <button class="btn-restart" onclick="restartGame()">🔄 Restart</button>
        </div>
        <div class="mode-box">
            <button class="btn-m bg-mm" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-en" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-num" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <div class="character-box" id="mediaBox">
        <img src="phway.jpg" alt="ဖွေးဖွေး">
    </div>

    <div class="card-container" onclick="speakCardContent()">
        <div class="card-inner" id="cardInner">
            <div class="card-front">?</div>
            <div class="card-back" id="cardContent">?</div>
        </div>
    </div>

    <button class="btn-draw" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>
    <div class="eval-group">
        <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
        <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
    </div>

    <script>
        const levelsData = { myanmar: ["က","ခ","ဂ","ဃ","င"], english: ["A","B","C","D","E"], numbers: ["၁","၂","၃","၄","၅"] };
        let mode = 'myanmar';
        let stars = 0, currentTarget = '', wrongCount = 0;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // အသံစနစ်အစုံ
        function playSfx(type) {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'draw') { // မဲနှိုက်သံ
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            } else if (type === 'wrong') { // မှားတဲ့အသံ
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 0.2);
            } else if (type === 'cheer') { // လက်ခုပ်သံ
                for(let i=0; i<3; i++) {
                    setTimeout(() => {
                        let cOsc = audioCtx.createOscillator();
                        let cGain = audioCtx.createGain();
                        cOsc.type = 'square'; cOsc.frequency.setValueAtTime(1000 + Math.random()*500, audioCtx.currentTime);
                        cGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        cGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                        cOsc.connect(cGain); cGain.connect(audioCtx.destination);
                        cOsc.start(); cOsc.stop(audioCtx.currentTime + 0.1);
                    }, i*100);
                }
                return;
            }
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function speakVoice(text) {
            window.speechSynthesis.cancel();
            let ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'my-MM'; ut.pitch = 1.2; ut.rate = 0.9;
            window.speechSynthesis.speak(ut);
        }

        function speakCardContent() { if (currentTarget) speakVoice(currentTarget); }

        function restartGame() {
            stars = 0; wrongCount = 0; currentTarget = '';
            document.getElementById('starCount').innerText = "⭐ ကြယ်: 0";
            document.getElementById('cardInner').classList.remove('flipped');
            document.getElementById('cardContent').innerText = '?';
            document.getElementById('mediaBox').innerHTML = `<img src="phway.jpg" alt="ဖွေးဖွေး">`;
        }

        function setMode(m) { mode = m; restartGame(); }

        function drawCard() {
            playSfx('draw');
            document.getElementById('cardInner').classList.remove('flipped');
            setTimeout(() => {
                let pool = levelsData[mode];
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                document.getElementById('cardContent').innerText = currentTarget;
                document.getElementById('cardInner').classList.add('flipped');
                setTimeout(() => speakVoice(currentTarget), 500);
            }, 50);
        }

        function assess(isCorrect) {
            if (isCorrect) {
                stars++;
                document.getElementById('starCount').innerText = `⭐ ကြယ်: ${stars}`;
                playSfx('cheer');
                speakVoice("ဖွေးဖွေးလေးကတောိလိုက်တာ");
                document.getElementById('mediaBox').innerHTML = `<video src="dance.mp4" autoplay loop muted playsinline></video>`;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
                wrongCount++;
                playSfx('wrong');
                let msg = wrongCount >= 3 ? "ဖွေးဖွေးမှားပဲမှားနေတာ စိတ်တိုလာပြီနော်" : "ဖွေးဖွေးမှားနေပြီနော်";
                speakVoice(msg);
                document.getElementById('mediaBox').innerHTML = `<img src="worng1.jpg" alt="Wrong">`;
            }
        }
    </script>
</body>
</html>
