<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🎈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Pyidaungsu', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(180deg, #74b9ff 0%, #81ecec 50%, #55efc4 100%);
        }

        /* 🌳 သဘာဝရှုခင်း Background Animation */
        .bg-nature {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        /* ☁️ တိမ်လှုပ်ရှားမှု */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            animation: moveClouds 25s linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }
        .cloud1 { width: 120px; height: 40px; top: 12%; left: -150px; }
        .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
        .cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

        .cloud2 { width: 160px; height: 50px; top: 22%; left: -200px; animation-delay: 10s; animation-duration: 35s; }
        .cloud2::before { width: 60px; height: 60px; top: -25px; left: 25px; }
        .cloud2::after { width: 50px; height: 50px; top: -18px; left: 75px; }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        /* ⛰️ တောင်တန်းများနှင့် သစ်ပင်များ */
        .hills-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35vh;
            pointer-events: none;
        }

        .top-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 5px solid #ff4757;
            backdrop-filter: blur(5px);
        }

        .title {
            font-size: 20px;
            color: #ff4757;
            margin: 0 0 4px 0;
        }

        .level-badge {
            background: #ffa502;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }

        .mode-group {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-m {
            padding: 6px 12px;
            border: 2px solid white;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .bg-myanmar { background: #ff4757; }
        .bg-english { background: #2ed573; color: #2f3542; }
        .bg-numbers { background: #1e90ff; }

        .card-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        /* 👧 ဖွေးဖွေးလေး Avatar Box */
        .phway-avatar-box {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 6px solid #ff4757;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            margin-bottom: 10px;
            background-color: #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .phway-avatar-box svg {
            width: 100%;
            height: 100%;
        }

        /* 💃 ကြီးကြီးမားမား ကပြသည့် Animation */
        .dance {
            animation: grandDance 0.6s infinite alternate ease-in-out;
            border-color: #2ed573 !important;
            box-shadow: 0 0 35px #2ed573 !important;
        }

        @keyframes grandDance {
            0% { transform: translateY(0) rotate(-20deg) scale(1.15); }
            50% { transform: translateY(-30px) rotate(0deg) scale(1.3); }
            100% { transform: translateY(0) rotate(20deg) scale(1.15); }
        }

        /* 😭 ကြီးကြီးမားမား ငိုပြသည့် Animation */
        .cry {
            animation: grandCry 0.4s infinite alternate ease-in-out;
            border-color: #ff4757 !important;
            filter: grayscale(30%);
        }

        @keyframes grandCry {
            0% { transform: translateX(-15px) translateY(5px) scale(0.9); }
            100% { transform: translateX(15px) translateY(-5px) scale(0.9); }
        }

        /* မျက်ရည်စီးကျသည့် Animation */
        .tears {
            display: none;
            position: absolute;
            top: 55%;
            width: 100%;
            justify-content: space-around;
            padding: 0 40px;
        }

        .cry .tears {
            display: flex;
        }

        .tear-drop {
            width: 8px;
            height: 16px;
            background: #00cec9;
            border-radius: 50%;
            animation: tearFall 0.5s infinite linear;
        }

        @keyframes tearFall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(30px); opacity: 0; }
        }

        .card-box {
            width: 170px;
            height: 170px;
            background: rgba(255, 255, 255, 0.95);
            border: 8px solid #ffa502;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 85px;
            font-weight: bold;
            color: #ff4757;
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            z-index: 5;
        }

        .draw-btn {
            background: linear-gradient(180deg, #eccc68 0%, #ffa502 100%);
            border: 4px solid #fff;
            color: #d63031;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 35px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #e1b12c, 0 8px 15px rgba(0,0,0,0.2);
        }

        .mic-btn {
            background: #ff4757;
            color: white;
            font-size: 17px;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 30px;
            border: 3px solid white;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(255, 71, 87, 0.4);
        }

        .listening {
            background: #2ed573 !important;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .eval-group {
            display: flex;
            gap: 12px;
        }

        .btn-eval {
            padding: 10px 18px;
            font-size: 15px;
            border: 3px solid white;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes { background: #2ed573; color: #2f3542; }
        .btn-no { background: #ff4757; }

        .speech-bubble {
            position: absolute;
            top: -45px;
            background: #fff;
            color: #2f3542;
            padding: 6px 16px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 🌳 သဘာဝရှုခင်း Background -->
    <div class="bg-nature">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        
        <svg class="hills-svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <!-- တောင်တန်းကြီးများ -->
            <path fill="#55efc4" opacity="0.7" d="M0,192L60,181.3C120,171,240,149,360,165.3C480,181,600,235,720,229.3C840,224,960,160,1080,138.7C1200,117,1320,139,1380,149.3L1440,160L1440,320L0,320Z"></path>
            <path fill="#00b894" opacity="0.9" d="M0,224L80,208C160,192,320,160,480,176C640,192,800,256,960,256C1120,256,1280,192,1360,160L1440,128L1440,320L0,320Z"></path>
            <!-- မြက်ခင်းနှင့် ရေကန် -->
            <path fill="#00cec9" d="M300,280 Q500,230 700,280 Q900,330 1100,280 L1440,320 L0,320 Z"></path>
        </svg>
    </div>

    <div class="top-nav">
        <h1 class="title">🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🎈</h1>
        <div class="level-badge" id="levelText">Level: 1 (မြန်မာ)</div>
        
        <div class="mode-group">
            <button class="btn-m bg-myanmar" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-english" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-numbers" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <div class="card-container">
        <div class="speech-bubble" id="speechBubble"></div>
        
        <div class="phway-avatar-box" id="avatarBox">
            <div class="tears">
                <div class="tear-drop"></div>
                <div class="tear-drop"></div>
            </div>
            <svg viewBox="0 0 100 100">
                <path d="M20,35 C10,50 15,80 30,85 C35,80 30,50 30,40 Z" fill="#2d3436"/>
                <path d="M80,35 C90,50 85,80 70,85 C65,80 70,50 70,40 Z" fill="#2d3436"/>
                <circle cx="50" cy="50" r="30" fill="#ffdfba"/>
                <path d="M20,45 C25,20 75,20 80,45 C70,30 30,30 20,45 Z" fill="#2d3436"/>
                <path d="M40,22 C35,12 45,15 50,22 C55,15 65,12 60,22 Z" fill="#ff4757"/>
                <circle cx="50" cy="22" r="3" fill="#ffa502"/>
                <circle cx="38" cy="48" r="4" fill="#2d3436"/>
                <circle cx="62" cy="48" r="4" fill="#2d3436"/>
                <circle cx="39" cy="46" r="1.5" fill="#ffffff"/>
                <circle cx="63" cy="46" r="1.5" fill="#ffffff"/>
                <ellipse cx="33" cy="54" rx="4" ry="2" fill="#ff7675" opacity="0.6"/>
                <ellipse cx="67" cy="54" rx="4" ry="2" fill="#ff7675" opacity="0.6"/>
                <path d="M42,58 Q50,66 58,58" fill="none" stroke="#d63031" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="card-box" id="card">?</div>
    </div>

    <div class="controls">
        <button class="draw-btn" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>

        <button class="mic-btn" id="micBtn" onclick="startListening()">
            🎙️ အသံဖတ်ပြမယ် (နားထောင်)
        </button>

        <div class="eval-group">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
        </div>
    </div>

    <script>
        const levelsData = {
            myanmar: {
                1: ["က","ခ","ဂ","ဃ","င"],
                2: ["စ","ဆ","ဇ","ဈ","ည"],
                3: ["တ","ထ","ဒ","ဓ","န","ပ","ဖ","ဗ","ဘ","မ"]
            },
            english: {
                1: ["A","B","C","D","E"],
                2: ["F","G","H","I","J"],
                3: ["K","L","M","N","O"]
            },
            numbers: {
                1: ["၁","၂","၃","၄","၅"],
                2: ["၆","၇","၈","၉","၁၀"],
                3: ["1","2","3","4","5"]
            }
        };

        let mode = 'myanmar';
        let level = 1;
        let currentTarget = '';

        const card = document.getElementById('card');
        const levelText = document.getElementById('levelText');
        const speech = document.getElementById('speechBubble');
        const avatarBox = document.getElementById('avatarBox');
        const micBtn = document.getElementById('micBtn');

        function playChime(isSuccess) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                if (isSuccess) {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.3);
                    });
                } else {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) { console.log(e); }
        }

        function setMode(m) {
            mode = m;
            level = 1;
            levelText.innerText = `Level: 1 (${m === 'myanmar' ? 'မြန်မာ' : m === 'english' ? 'English' : 'ဂဏန်း'})`;
            card.innerText = '?';
            currentTarget = '';
            resetAvatar();
        }

        function drawCard() {
            resetAvatar();
            const pool = levelsData[mode][level];
            currentTarget = pool[Math.floor(Math.random() * pool.length)];
            card.innerText = currentTarget;
        }

        function assess(isCorrect) {
            resetAvatar();
            playChime(isCorrect);
            if (isCorrect) {
                avatarBox.classList.add('dance');
                showSpeech("💃 တော်လိုက်တာ ဖွေးဖွေးလေးက! 🎉");
            } else {
                avatarBox.classList.add('cry');
                showSpeech("😭 ကြိုးစားပါအုန်း ဖွေးဖွေးလေးရေ~");
            }
        }

        function resetAvatar() {
            avatarBox.classList.remove('dance', 'cry');
            speech.style.display = 'none';
        }

        function showSpeech(text) {
            speech.innerText = text;
            speech.style.display = 'block';
        }

        // 🎙️ Speech Recognition (အသံနားထောင်စနစ် မွမ်းမံထားမှု)
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("သင့် ဖုန်း Browser ရဲ့ Microphone ခွင့်ပြုချက် (Allow) ပေးထားရန် လိုအပ်ပါသည် သို့မဟုတ် Chrome ကို သုံးပေးပါဗျာ!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = mode === 'english' ? 'en-US' : 'my-MM';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.classList.add('listening');
            micBtn.innerText = "🎧 နားထောင်နေပါတယ်...";

            recognition.start();

            recognition.onresult = function(event) {
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎙️ အသံဖတ်ပြမယ် (နားထောင်)";
                
                const spokenText = event.results[0][0].transcript.trim();

                if (!currentTarget || currentTarget === '?') {
                    showSpeech("မဲ အရင်နှိုက်ပေးပါနော်! 🎲");
                    return;
                }

                if (spokenText.toLowerCase().includes(currentTarget.toLowerCase())) {
                    assess(true);
                } else {
                    assess(false);
                }
            };

            recognition.onerror = function(event) {
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎙️ အသံဖတ်ပြမယ် (နားထောင်)";
                showSpeech("အသံ မကြားရပါဘူး သို့မဟုတ် Mic ပိတ်ထားပါတယ် 😅");
            };

            recognition.onend = function() {
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎙️ အသံဖတ်ပြမယ် (နားထောင်)";
            };
        }
    </script>
</body>
</html>
