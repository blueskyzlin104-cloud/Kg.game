<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🎈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Pyidaungsu', sans-serif;
            margin: 0;
            padding: 0;
            /* Phway Phway Photo as Background with Overlay */
            background: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)), 
                        url('https://raw.githubusercontent.com/blueskyzlin104-cloud/Kg.game/main/phway.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            overflow-x: hidden;
        }

        .top-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-bottom: 6px solid #ff4757;
        }

        .title {
            font-size: 22px;
            color: #ff4757;
            margin: 0 0 6px 0;
        }

        .level-badge {
            background: #ffa502;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
        }

        .mode-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-m {
            padding: 8px 14px;
            border: 3px solid white;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .bg-myanmar { background: #ff4757; }
        .bg-english { background: #2ed573; color: #2f3542; }
        .bg-numbers { background: #1e90ff; }

        .card-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animated Phway Phway Avatar/Sticker */
        .phway-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid #ff4757;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            transition: all 0.5s ease;
            background: url('https://raw.githubusercontent.com/blueskyzlin104-cloud/Kg.game/main/phway.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Animations */
        .dance {
            animation: happyDance 0.6s infinite alternate;
            border-color: #2ed573;
        }

        @keyframes happyDance {
            0% { transform: translateY(0) rotate(-15deg) scale(1.1); }
            100% { transform: translateY(-20px) rotate(15deg) scale(1.2); }
        }

        .cry {
            animation: sadCry 0.4s infinite alternate;
            border-color: #ff4757;
            filter: grayscale(40%);
        }

        @keyframes sadCry {
            0% { transform: translateX(-8px) scale(0.95); }
            100% { transform: translateX(8px) scale(0.95); }
        }

        .card-box {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.95);
            border: 8px solid #ffa502;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            font-weight: bold;
            color: #ff4757;
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }

        .draw-btn {
            background: linear-gradient(180deg, #eccc68 0%, #ffa502 100%);
            border: 4px solid #fff;
            color: #d63031;
            font-size: 24px;
            font-weight: bold;
            padding: 12px 40px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #e1b12c, 0 10px 15px rgba(0,0,0,0.2);
        }

        .eval-group {
            display: flex;
            gap: 15px;
        }

        .btn-eval {
            padding: 12px 22px;
            font-size: 18px;
            border: 3px solid white;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes { background: #2ed573; color: #2f3542; }
        .btn-no { background: #ff4757; }

        .speech-bubble {
            position: absolute;
            top: -40px;
            background: #fff;
            color: #2f3542;
            padding: 6px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1 class="title">🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🎈</h1>
        <div class="level-badge" id="levelText">Level: 1 (မြန်မာ)</div>
        
        <div class="mode-group">
            <button class="btn-m bg-myanmar" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-english" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-numbers" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <div class="card-container">
        <div class="speech-bubble" id="speechBubble"></div>
        <div class="phway-avatar" id="avatar"></div>
        <div class="card-box" id="card">?</div>
    </div>

    <div class="controls">
        <button class="draw-btn" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>

        <div class="eval-group">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
        </div>
    </div>

    <script>
        const levelsData = {
            myanmar: {
                1: ["က","ခ","ဂ","ဃ","င"],
                2: ["စ","ဆ","ဇ","ဈ","ည"],
                3: ["တ","ထ","ဒ","ဓ","န","ပ","ဖ","ဗ","ဘ","မ"]
            },
            english: {
                1: ["A","B","C","D","E"],
                2: ["F","G","H","I","J"],
                3: ["K","L","M","N","O"]
            },
            numbers: {
                1: ["၁","၂","၃","၄","၅"],
                2: ["၆","၇","၈","၉","၁၀"],
                3: ["1","2","3","4","5"]
            }
        };

        let mode = 'myanmar';
        let level = 1;

        const card = document.getElementById('card');
        const levelText = document.getElementById('levelText');
        const speech = document.getElementById('speechBubble');
        const avatar = document.getElementById('avatar');

        // မြန်မာမလေး အသံထွက်စနစ်
        function speakMyanmar(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'my-MM';
            utterance.rate = 0.85;
            utterance.pitch = 1.3; // ကလေးအသံပုံစံ ရစေရန် pitch မြှင့်ထားသည်
            
            // မြန်မာ Voice ရှာဖွေစစ်ဆေးခြင်း
            const voices = window.speechSynthesis.getVoices();
            const myVoice = voices.find(v => v.lang.includes('my') || v.name.includes('Myanmar'));
            if(myVoice) utterance.voice = myVoice;

            window.speechSynthesis.speak(utterance);
        }

        function setMode(m) {
            mode = m;
            level = 1;
            levelText.innerText = `Level: 1 (${m === 'myanmar' ? 'မြန်မာ' : m === 'english' ? 'English' : 'ဂဏန်း'})`;
            card.innerText = '?';
            resetAvatar();
        }

        function drawCard() {
            resetAvatar();
            const pool = levelsData[mode][level];
            const randomChar = pool[Math.floor(Math.random() * pool.length)];
            card.innerText = randomChar;
        }

        function assess(isCorrect) {
            resetAvatar();
            if (isCorrect) {
                avatar.classList.add('dance');
                showSpeech("💃 တော်လိုက်တာ ဖွေးဖွေးလေးက! 🎉");
                speakMyanmar("တော်လိုက်တာ ဖွေးဖွေးလေးက");
            } else {
                avatar.classList.add('cry');
                showSpeech("😭 ကြိုးစားပါအုန်း ဖွေးဖွေးလေးရေ~");
                speakMyanmar("ကြိုးစားပါအုန်း ဖွေးဖွေးလေးရေ");
            }
        }

        function resetAvatar() {
            avatar.classList.remove('dance', 'cry');
            speech.style.display = 'none';
        }

        function showSpeech(text) {
            speech.innerText = text;
            speech.style.display = 'block';
        }

        // Voice စနစ် အသင့်ဖြစ်အောင် တင်ယူခြင်း
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
