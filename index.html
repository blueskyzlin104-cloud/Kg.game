<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🎈</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Pyidaungsu', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(180deg, #74b9ff 0%, #81ecec 50%, #55efc4 100%);
        }

        /* 🌳 သဘာဝရှုခင်း Background */
        .bg-nature {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            animation: moveClouds 25s linear infinite;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute;
            background: rgba(255, 255, 255, 0.85); border-radius: 50%;
        }
        .cloud1 { width: 120px; height: 40px; top: 10%; left: -150px; }
        .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
        .cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        .hills-svg {
            position: absolute; bottom: 0; width: 100%; height: 30vh; pointer-events: none;
        }

        /* Navigation & Scoreboard */
        .top-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 4px solid #ff4757;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .title { font-size: 18px; color: #ff4757; margin: 0 0 4px 0; }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #d63031;
            margin-bottom: 6px;
        }

        .star-badge { background: #ffeaa7; padding: 3px 12px; border-radius: 15px; border: 2px solid #ffa502; }

        .mode-group { display: flex; justify-content: center; gap: 6px; }

        .btn-m {
            padding: 5px 10px; border: 2px solid white; border-radius: 12px;
            font-size: 12px; font-weight: bold; color: white; cursor: pointer;
        }
        .bg-myanmar { background: #ff4757; }
        .bg-english { background: #2ed573; color: #2f3542; }
        .bg-numbers { background: #1e90ff; }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }

        /* 🖼️ ဖွေးဖွေးလေး ဓာတ်ပုံ သို့မဟုတ် ကာတွန်း ရုပ်ပုံ Box */
        .phway-character {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 6px solid #ff4757;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            margin-bottom: 10px;
            background-color: #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .phway-character img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Dance & Cry Animations */
        .dance {
            animation: fullDance 0.6s infinite alternate ease-in-out;
            border-color: #2ed573 !important;
            box-shadow: 0 0 30px #2ed573 !important;
        }

        @keyframes fullDance {
            0% { transform: translateY(0) rotate(-15deg) scale(1.1); }
            50% { transform: translateY(-20px) rotate(0deg) scale(1.2); }
            100% { transform: translateY(0) rotate(15deg) scale(1.1); }
        }

        .cry {
            animation: fullCry 0.3s infinite alternate ease-in-out;
            border-color: #ff4757 !important;
            filter: grayscale(40%);
        }

        @keyframes fullCry {
            0% { transform: translateX(-12px) scale(0.95); }
            100% { transform: translateX(12px) scale(0.95); }
        }

        /* Flash Card */
        .card-box {
            width: 160px; height: 160px;
            background: rgba(255, 255, 255, 0.95);
            border: 8px solid #ffa502;
            border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; font-weight: bold; color: #ff4757;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
        }

        .sound-hint {
            position: absolute; bottom: 5px; right: 10px; font-size: 14px; color: #70a1ff;
        }

        /* Controls & Buttons */
        .controls {
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; margin-bottom: 15px; width: 100%; z-index: 5;
        }

        .draw-btn {
            background: linear-gradient(180deg, #eccc68 0%, #ffa502 100%);
            border: 3px solid #fff; color: #d63031;
            font-size: 20px; font-weight: bold; padding: 10px 30px;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 0 #e1b12c, 0 8px 15px rgba(0,0,0,0.2);
        }

        .mic-btn {
            background: #ff4757; color: white; font-size: 16px; font-weight: bold;
            padding: 10px 20px; border-radius: 30px; border: 3px solid white;
            cursor: pointer; box-shadow: 0 5px 12px rgba(255, 71, 87, 0.4);
        }

        .eval-group { display: flex; gap: 12px; }

        .btn-eval {
            padding: 8px 16px; font-size: 15px; border: 3px solid white;
            border-radius: 30px; color: white; font-weight: bold; cursor: pointer;
        }
        .btn-yes { background: #2ed573; color: #2f3542; }
        .btn-no { background: #ff4757; }

        .speech-bubble {
            position: absolute; top: -35px; background: #fff; color: #2f3542;
            padding: 6px 14px; border-radius: 15px; font-weight: bold;
            font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div class="bg-nature">
        <div class="cloud cloud1"></div>
        <svg class="hills-svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#55efc4" opacity="0.7" d="M0,192L60,181.3C120,171,240,149,360,165.3C480,181,600,235,720,229.3C840,224,960,160,1080,138.7C1200,117,1320,139,1380,149.3L1440,160L1440,320L0,320Z"></path>
            <path fill="#00b894" opacity="0.9" d="M0,224L80,208C160,192,320,160,480,176C640,192,800,256,960,256C1120,256,1280,192,1360,160L1440,128L1440,320L0,320Z"></path>
        </svg>
    </div>

    <div class="top-nav">
        <h1 class="title">🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🎈</h1>
        <div class="score-board">
            <span class="star-badge" id="starCount">⭐ ကြယ်: 0</span>
            <span id="levelText">Level: 1</span>
        </div>
        <div class="mode-group">
            <button class="btn-m bg-myanmar" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-english" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-numbers" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <div class="game-area">
        <div class="speech-bubble" id="speechBubble"></div>
        
        <!-- 🖼️ ဖွေးဖွေးလေး ဓာတ်ပုံ Box (ပုံမရှိရင် ကာတွန်းပုံ အလိုအလျောက် ပေါ်မည်) -->
        <div class="phway-character" id="avatarBox">
            <img id="phwayImg" src="phway.jpg" alt="ဖွေးဖွေးလေး" onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=PhwayPhway&hair=long01,long02&hairColor=2c1b18';">
        </div>

        <!-- Flash Card -->
        <div class="card-box" id="card" onclick="speakCurrentCard()">
            ?
            <span class="sound-hint">🔊</span>
        </div>
    </div>

    <div class="controls">
        <button class="draw-btn" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>

        <button class="mic-btn" id="micBtn" onclick="startListening()">
            🎙️ အသံဖတ်ပြမယ် (နားထောင်)
        </button>

        <div class="eval-group">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
        </div>
    </div>

    <script>
        const levelsData = {
            myanmar: {
                1: ["က","ခ","ဂ","ဃ","င"],
                2: ["စ","ဆ","ဇ","ဈ","ည"],
                3: ["တ","ထ","ဒ","ဓ","န","ပ","ဖ","ဗ","ဘ","မ"]
            },
            english: {
                1: ["A","B","C","D","E"],
                2: ["F","G","H","I","J"],
                3: ["K","L","M","N","O"]
            },
            numbers: {
                1: ["၁","၂","၃","၄","၅"],
                2: ["၆","၇","၈","၉","၁၀"],
                3: ["1","2","3","4","5"]
            }
        };

        let mode = 'myanmar';
        let level = 1;
        let stars = 0;
        let currentTarget = '';

        const card = document.getElementById('card');
        const levelText = document.getElementById('levelText');
        const starCount = document.getElementById('starCount');
        const speech = document.getElementById('speechBubble');
        const avatarBox = document.getElementById('avatarBox');

        function speakCurrentCard() {
            if (!currentTarget || currentTarget === '?') return;
            const utterance = new SpeechSynthesisUtterance(currentTarget);
            utterance.lang = mode === 'english' ? 'en-US' : 'my-MM';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function playChime(isSuccess) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                if (isSuccess) {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.3);
                    });
                } else {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) { console.log(e); }
        }

        function setMode(m) {
            mode = m;
            level = 1;
            levelText.innerText = `Level: 1`;
            card.innerText = '?';
            currentTarget = '';
            resetAvatar();
        }

        function drawCard() {
            resetAvatar();
            const pool = levelsData[mode][level];
            currentTarget = pool[Math.floor(Math.random() * pool.length)];
            card.innerHTML = `${currentTarget}<span class="sound-hint">🔊</span>`;
            speakCurrentCard();
        }

        function assess(isCorrect) {
            resetAvatar();
            playChime(isCorrect);
            if (isCorrect) {
                stars += 1;
                starCount.innerText = `⭐ ကြယ်: ${stars}`;
                avatarBox.classList.add('dance');
                showSpeech("💃 တော်လိုက်တာ ဖွေးဖွေးလေးက! 🎉");
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                }
            } else {
                avatarBox.classList.add('cry');
                showSpeech("😭 ကြိုးစားပါအုန်း ဖွေးဖွေးလေးရေ~");
            }
        }

        function resetAvatar() {
            avatarBox.classList.remove('dance', 'cry');
            speech.style.display = 'none';
        }

        function showSpeech(text) {
            speech.innerText = text;
            speech.style.display = 'block';
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("သင့် ဖုန်းတွင် Microphone ကို ခွင့်ပြုပေးပါဗျာ!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = mode === 'english' ? 'en-US' : 'my-MM';

            const micBtn = document.getElementById('micBtn');
            micBtn.innerText = "🎧 နားထောင်နေပါတယ်...";

            recognition.start();

            recognition.onresult = function(event) {
                micBtn.innerText = "🎙️ အသံဖတ်ပြမယ် (နားထောင်)";
                const spokenText = event.results[0][0].transcript.trim();

                if (!currentTarget || currentTarget === '?') {
                    showSpeech("မဲ အရင်နှိုက်ပေးပါနော်! 🎲");
                    return;
                }

                if (spokenText.toLowerCase().includes(currentTarget.toLowerCase())) {
                    assess(true);
                } else {
                    assess(false);
                }
            };

            recognition.onerror = function() {
                micBtn.innerText = "🎙️ အသံဖတ်ပြမယ် (နားထောင်)";
                showSpeech("အသံ မကြားရပါဘူးနော် 😅");
            };
        }
    </script>
</body>
</html>
