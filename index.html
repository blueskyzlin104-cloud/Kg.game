<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🦄</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');

        * { box-sizing: border-box; font-family: 'Padauk', sans-serif; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; position: relative;
            background: linear-gradient(-45deg, #00c6ff, #0072ff, #38ef7d, #11998e);
            background-size: 400% 400%; animation: gradientBG 10s ease infinite; padding: 6px;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .top-nav {
            width: 98%; max-width: 600px; padding: 6px 12px;
            background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(12px);
            border-radius: 20px; border: 2px solid rgba(255,255,255,0.8);
            display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 10;
        }

        .title-text { font-size: 18px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .status-box { display: flex; justify-content: space-around; width: 100%; align-items: center; }
        
        .badge {
            background: #ffeaa7; padding: 3px 10px; border-radius: 20px;
            font-size: 13px; color: #d35400; border: 2px solid #f39c12; font-weight: bold;
        }

        .btn-action {
            background: #ff7675; color: white; border: 2px solid #fff;
            padding: 3px 8px; border-radius: 15px; font-size: 11px; font-weight: bold; cursor: pointer;
        }

        .mode-box { display: flex; gap: 6px; }
        .btn-m { padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; border: 2px solid #fff; cursor: pointer; }
        .bg-mm { background: #ff4757; } .bg-en { background: #2ed573; color: #2f3542; } .bg-num { background: #1e90ff; }

        .game-main {
            flex: 1; width: 100%; max-width: 500px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px; z-index: 5; position: relative;
        }

        .speech-bubble {
            position: absolute; top: -12px; background: #fff; color: #2d3436;
            padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold;
            display: none; z-index: 30; border: 2px solid #fdcb6e;
        }

        .mic-status {
            background: #e74c3c; color: white; padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: bold; display: none; animation: pulse 1.5s infinite;
            border: 2px solid white;
        }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .character-box {
            width: 88vw; height: 32vh; max-width: 380px; max-height: 240px;
            border-radius: 25px; overflow: hidden; position: relative;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.25); border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .character-box img, .character-box video {
            width: 100%; height: 100%; object-fit: contain; object-position: top center; border-radius: 20px;
        }

        .accessory-overlay {
            position: absolute; top: 2px; left: 50%;
            transform: translateX(-50%); font-size: 45px; z-index: 20;
            pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .card-container { perspective: 1000px; width: 85vw; height: 18vh; max-width: 360px; max-height: 140px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 65px; font-weight: bold; border: 5px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .card-front { background: linear-gradient(145deg, #f1c40f, #f39c12); color: white; }
        .card-back { background: linear-gradient(145deg, #ffffff, #fff3bf); color: #e74c3c; transform: rotateY(180deg); border-color: #f1c40f; }

        .bottom-controls { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 10; }
        .btn-draw {
            width: 92%; background: linear-gradient(180deg, #f1c40f 0%, #e67e22 100%);
            color: #fff; font-size: 20px; font-weight: bold; padding: 10px;
            border-radius: 50px; border: 3px solid #fff; cursor: pointer; box-shadow: 0 4px 0 #d35400;
        }

        .eval-group { display: flex; gap: 10px; width: 92%; }
        .btn-eval { flex: 1; padding: 8px; font-size: 15px; font-weight: bold; color: white; border-radius: 20px; border: 2px solid white; cursor: pointer; }
        .btn-yes { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
        .btn-no { background: #ff7675; box-shadow: 0 4px 0 #d63031; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.75); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px);
        }
        .modal-card { background: #fff; padding: 20px; border-radius: 25px; text-align: center; border: 5px solid #f1c40f; max-width: 90%; width: 320px; }
        .modal-title { font-size: 20px; color: #d35400; font-weight: bold; }
        .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; font-size: 35px; }
        .btn-close { background: #2ecc71; color: white; border: none; padding: 8px 20px; font-size: 16px; font-weight: bold; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1 class="title-text">🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🦄</h1>
        <div class="status-box">
            <span class="badge" id="starCount">⭐ 0</span>
            <span class="badge" id="levelText">🏆 Level: 1</span>
            <button class="btn-action" onclick="toggleAcc()">👑 အလှပြင်</button>
            <button class="btn-action" onclick="openStickerBook()">🧩 စတစ်ကာ</button>
            <button class="btn-action" onclick="restartGame()">🔄 Reset</button>
        </div>
        <div class="mode-box">
            <button class="btn-m bg-mm" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-en" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-num" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <div class="game-main">
        <div class="speech-bubble" id="speechBubble"></div>
        <div class="mic-status" id="micStatus">🎙️ ကလေးဖတ်တာ နားထောင်နေပါတယ်...</div>

        <div class="character-box" id="mediaBox">
            <div class="accessory-overlay" id="accOverlay"></div>
            <img src="phway.jpg" alt="ဖွေးဖွေး">
        </div>

        <div class="card-container" onclick="speakCardContent()">
            <div class="card-inner" id="cardInner">
                <div class="card-front">?</div>
                <div class="card-back" id="cardContent">?</div>
            </div>
        </div>
    </div>

    <div class="bottom-controls">
        <button class="btn-draw" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>
        <div class="eval-group">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
        </div>
    </div>

    <div class="modal" id="trophyModal">
        <div class="modal-card">
            <div class="modal-title" id="trophyTitle">Level Up!</div>
            <div style="font-size:70px; margin:10px 0;" id="trophyIcon">🐣 ➡️ 🐱</div>
            <p id="trophySub" style="font-size:14px; margin-bottom:15px;">ဉာဏ်ကြီးရှင် ဥလေး ကွဲသွားပါပြီ!</p>
            <button class="btn-close" onclick="closeModal('trophyModal')">ဆက်ဆော့မယ် 🚀</button>
        </div>
    </div>

    <div class="modal" id="stickerModal">
        <div class="modal-card">
            <div class="modal-title">🧩 စတစ်ကာ စာအုပ်</div>
            <div class="sticker-grid" id="stickerGrid"></div>
            <button class="btn-close" onclick="closeModal('stickerModal')">ပိတ်မယ်</button>
        </div>
    </div>

    <script>
        const levelsData = {
            myanmar: {
                1: [ { c: "က", p: "က - ကလေးလေး 👶", alt: ["က", "ကလေး", "ကလေးလေး"] }, { c: "ခ", p: "ခ - ခွေးလေး 🐶", alt: ["ခ", "ခွေး", "ခွေးလေး"] }, { c: "ဂ", p: "ဂ - ဂဏန်း 🦀", alt: ["ဂ", "ဂဏန်း"] }, { c: "ဃ", p: "ဃ - ဃေါင်း 🦚", alt: ["ဃ", "ဒေါင်း"] }, { c: "င", p: "င - ငါးလေး 🐟", alt: ["င", "ငါး", "ငါးလေး"] } ],
                2: [ { c: "စ", p: "စ - စာကလေး 🐦", alt: ["စ", "စာကလေး"] }, { c: "ဆ", p: "ဆ - ဆင်ကြီး 🐘", alt: ["ဆ", "ဆင်"] }, { c: "ဇ", p: "ဇ - ဇွန်း 🥄", alt: ["ဇ", "ဇွန်း"] }, { c: "ဈ", p: "ဈ - ဈေး 🛒", alt: ["ဈ", "ဈေး"] }, { c: "ည", p: "ည - ညောင်ပင် 🌳", alt: ["ည", "ညောင်ပင်"] } ],
                3: [ { c: "တ", p: "တ - တံခါး 🚪", alt: ["တ", "တံခါး"] }, { c: "ထ", p: "ထ - ထီး ☂️", alt: ["ထ", "ထီး"] }, { c: "ဒ", p: "ဒ - ဒိုက် 🦆", alt: ["ဒ", "ဒိုက်", "ဘဲ"] }, { c: "ဓ", p: "ဓ - ဓား 🔪", alt: ["ဓ", "ဓား"] }, { c: "န", p: "န - နွား 🐮", alt: ["န", "နွား"] } ],
                4: [ { c: "ပ", p: "ပ - ပန်းသီး 🍎", alt: ["ပ", "ပန်းသီး"] }, { c: "ဖ", p: "ဖ - ဖယောင်းတိုင် 🕯️", alt: ["ဖ", "ဖယောင်းတိုင်"] }, { c: "ဗ", p: "ဗ - ဗုံ 🥁", alt: ["ဗ", "ဗုံ"] }, { c: "ဘ", p: "ဘ - ဘောလုံး ⚽", alt: ["ဘ", "ဘောလုံး"] }, { c: "မ", p: "မ - ကြောင် 🐱", alt: ["မ", "ကြောင်"] } ],
                5: [ { c: "ယ", p: "ယ - ယုန် 🐰", alt: ["ယ", "ယုန်"] }, { c: "ရ", p: "ရ - ရထား 🚆", alt: ["ရ", "ရထား"] }, { c: "လ", p: "လ - လမင်း 🌙", alt: ["လ", "လမင်း"] }, { c: "ဝ", p: "ဝ - ဝက် 🐷", alt: ["ဝ", "ဝက်"] }, { c: "သ", p: "သ - သရက်သီး 🥭", alt: ["သ", "သရက်သီး"] } ]
            },
            english: {
                1: [ { c: "A", p: "A for Apple 🍎", alt: ["a", "apple"] }, { c: "B", p: "B for Ball ⚽", alt: ["b", "ball"] }, { c: "C", p: "C for Cat 🐱", alt: ["c", "cat"] }, { c: "D", p: "D for Dog 🐶", alt: ["d", "dog"] }, { c: "E", p: "E for Elephant 🐘", alt: ["e", "elephant"] } ],
                2: [ { c: "F", p: "F for Fish 🐟", alt: ["f", "fish"] }, { c: "G", p: "G for Grapes 🍇", alt: ["g", "grapes"] }, { c: "H", p: "H for Hat 🎩", alt: ["h", "hat"] }, { c: "I", p: "I for Ice Cream 🍦", alt: ["i", "ice cream"] }, { c: "J", p: "J for Juice 🧃", alt: ["j", "juice"] } ],
                3: [ { c: "K", p: "K for Kite 🪁", alt: ["k", "kite"] }, { c: "L", p: "L for Lion 🦁", alt: ["l", "lion"] }, { c: "M", p: "M for Monkey 🐒", alt: ["m", "monkey"] }, { c: "N", p: "N for Nest 🪺", alt: ["n", "nest"] }, { c: "O", p: "O for Orange 🍊", alt: ["o", "orange"] } ],
                4: [ { c: "P", p: "P for Panda 🐼", alt: ["p", "panda"] }, { c: "Q", p: "Q for Queen 👑", alt: ["q", "queen"] }, { c: "R", p: "R for Rabbit 🐰", alt: ["r", "rabbit"] }, { c: "S", p: "S for Sun ☀️", alt: ["s", "sun"] }, { c: "T", p: "T for Tiger 🐯", alt: ["t", "tiger"] } ],
                5: [ { c: "U", p: "U for Umbrella ☂️", alt: ["u", "umbrella"] }, { c: "V", p: "V for Van 🚐", alt: ["v", "van"] }, { c: "W", p: "W for Watermelon 🍉", alt: ["w", "watermelon"] }, { c: "X", p: "X for Xylophone 🎼", alt: ["x", "xylophone"] }, { c: "Y", p: "Y for Yo-Yo 🪀", alt: ["y", "yo-yo"] }, { c: "Z", p: "Z for Zebra 🦓", alt: ["z", "zebra"] } ]
            },
            numbers: {
                1: [ { c: "၁", p: "၁ - တစ် 1️⃣", alt: ["၁", "တစ်", "1", "one"] }, { c: "၂", p: "၂ - နှစ် 2️⃣", alt: ["၂", "နှစ်", "2", "two"] }, { c: "၃", p: "၃ - သုံး 3️⃣", alt: ["၃", "သုံး", "3", "three"] }, { c: "၄", p: "၄ - လေး 4️⃣", alt: ["၄", "လေး", "4", "four"] }, { c: "၅", p: "၅ - ငါး 5️⃣", alt: ["၅", "ငါး", "5", "five"] } ],
                2: [ { c: "၆", p: "၆ - ခြောက် 6️⃣", alt: ["၆", "ခြောက်", "6"] }, { c: "၇", p: "၇ - ခုနစ် 7️⃣", alt: ["၇", "ခုနစ်", "7"] }, { c: "၈", p: "၈ - ရှစ် 8️⃣", alt: ["၈", "ရှစ်", "8"] }, { c: "၉", p: "၉ - ကိုး 9️⃣", alt: ["၉", "ကိုး", "9"] }, { c: "၁၀", p: "၁၀ - တစ်ဆယ် 🔟", alt: ["၁၀", "တစ်ဆယ်", "10"] } ],
                3: [ { c: "1", p: "One 1️⃣", alt: ["1", "one"] }, { c: "2", p: "Two 2️⃣", alt: ["2", "two"] }, { c: "3", p: "Three 3️⃣", alt: ["3", "three"] }, { c: "4", p: "Four 4️⃣", alt: ["4", "four"] }, { c: "5", p: "Five 5️⃣", alt: ["5", "five"] } ],
                4: [ { c: "6", p: "Six 6️⃣", alt: ["6", "six"] }, { c: "7", p: "Seven 7️⃣", alt: ["7", "seven"] }, { c: "8", p: "Eight 8️⃣", alt: ["8", "eight"] }, { c: "9", p: "Nine 9️⃣", alt: ["9", "nine"] }, { c: "10", p: "Ten 🔟", alt: ["10", "ten"] } ],
                5: [ { c: "20", p: "Twenty 2️⃣0️⃣", alt: ["20", "twenty"] }, { c: "30", p: "Thirty 3️⃣0️⃣", alt: ["30", "thirty"] } ]
            }
        };

        const accessories = ["", "👑", "🧙‍♀️", "👓", "🎀", "🦄"];
        const stickerList = ["🦄", "🌟", "🐥", "🐰", "🎈", "🍭", "🎨", "👑", "🦋", "🍩", "🌸", "🍕"];

        let mode = 'myanmar';
        let level = 1, stars = 0, currentItem = null, wrongCount = 0;
        let accIndex = 0, unlockedStickers = [];
        let audioCtx = null;
        let recognition = null;
        let isListening = false;

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        function playSfx(type) {
            initAudio(); if (!audioCtx) return;
            let now = audioCtx.currentTime;

            if (type === 'draw') {
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);

            } else if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.3);
                });

            } else if (type === 'wrong') {
                let osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc1.type = 'sawtooth'; osc2.type = 'sawtooth';
                osc1.frequency.setValueAtTime(130, now); osc2.frequency.setValueAtTime(1385, now);
                gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
                osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
                osc1.start(now); osc2.start(now); osc1.stop(now + 0.45); osc2.stop(now + 0.45);
            }
        }

        function playMyanmarWishSound(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = mode === 'english' ? 'en-US' : 'my-MM'; 
            ut.pitch = 1.1; ut.rate = 0.5
            ;
            window.speechSynthesis.speak(ut);
        }

        function speakCardContent() { if (currentItem) playMyanmarWishSound(currentItem.p); }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('micStatus').style.display = 'block';
            };

            recognition.onresult = function(event) {
                stopListening();
                let spokenText = event.results[0][0].transcript.toLowerCase().trim();

                if (currentItem && currentItem.alt) {
                    let isMatched = currentItem.alt.some(word => spokenText.includes(word.toLowerCase()));
                    if (isMatched) {
                        assess(true);
                    } else {
                        assess(false);
                    }
                }
            };

            recognition.onerror = function() { stopListening(); };
            recognition.onend = function() { stopListening(); };
        }

        function startListening() {
            if (!recognition) initSpeechRecognition();
            if (recognition && !isListening) {
                try {
                    recognition.lang = mode === 'english' ? 'en-US' : 'my-MM';
                    recognition.start();
                } catch(e) {}
            }
        }

        function stopListening() {
            isListening = false;
            document.getElementById('micStatus').style.display = 'none';
            if (recognition) recognition.stop();
        }

        function toggleAcc() {
            accIndex = (accIndex + 1) % accessories.length;
            document.getElementById('accOverlay').innerText = accessories[accIndex];
        }

        function drawCard() {
            stopListening();
            playSfx('draw');
            const cardInner = document.getElementById('cardInner');
            cardInner.classList.remove('flipped');

            setTimeout(() => {
                const pool = levelsData[mode][level];
                currentItem = pool[Math.floor(Math.random() * pool.length)];
                document.getElementById('cardContent').innerText = currentItem.c;
                cardInner.classList.add('flipped');

                setTimeout(() => { startListening(); }, 500);
            }, 150);
        }

        function assess(isCorrect) {
    stopListening();
    document.getElementById('speechBubble').style.display = 'none';

    if (isCorrect) {
        wrongCount = 0; 
        stars += 1;
        document.getElementById('starCount').innerText = `⭐ ${stars}`;

        // 🎵 မှန်ရင် correct.mp3 ကို ဖွင့်ပါမည်
        let correctAudio = new Audio('correct.mp3');
        correctAudio.play();

        const phonics = currentItem ? currentItem.p : "";
        showSpeech(`💃 ${phonics}! 🎉`);

        document.getElementById('mediaBox').querySelector('img')?.remove();
        document.getElementById('mediaBox').innerHTML = `<div class="accessory-overlay" id="accOverlay">${accessories[accIndex]}</div><video src="dance.mp4" autoplay loop muted playsinline></video>`;
        
        if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });

        if (stars % 10 === 0) {
            let st = stickerList[(stars / 10 - 1) % stickerList.length];
            if (!unlockedStickers.includes(st)) unlockedStickers.push(st);
            showSpeech(`🎁 စတစ်ကာသစ် ရပြီ: ${st}`);
        }

        checkLevelUp();

    } else {
        wrongCount += 1;

        // 🎵 မှားသွားရင် worng.mp3 သို့မဟုတ် ၃ ကြိမ်ထက်ပိုမှားရင် double worng.mp3 ကို ဖွင့်ပါမည်
        let wrongAudio = (wrongCount >= 3) ? new Audio('double worng.mp3') : new Audio('worng.mp3');
        wrongAudio.play();

        let phonics = currentItem ? currentItem.p : "";
        let msg = wrongCount >= 3 ? "ဖွေးဖွေးမှားပဲမှားနေတာ စိတ်တိုလာပြီနော်" : "ဖွေးဖွေးမှားနေပြီနော်";
        showSpeech(`😭 ${msg}`);
        
        document.getElementById('mediaBox').innerHTML = `<div class="accessory-overlay" id="accOverlay">${accessories[accIndex]}</div><img src="worng1.jpg" alt="Wrong">`;
    }
}


        function checkLevelUp() {
            let newLevel = Math.floor(stars / 50) + 1;
            if (newLevel > 5) newLevel = 5;

            if (newLevel > level) {
                level = newLevel;
                document.getElementById('levelText').innerText = `🏆 Level: ${level}`;
                
                let pets = ["", "🐱 ဉာဏ်ကြီးရှင်ကြောင်", "🐰 ဉာဏ်ကြီးရှင်ယုန်", "🦄 ယူနီကွန်း", "🦁 ဉာဏ်ကြီးရှင်ခြင်္သေ့"];
                document.getElementById('trophyTitle').innerText = `Level ${level} တက်သွားပြီ!`;
                document.getElementById('trophyIcon').innerText = "🐣 ➡️ " + pets[level-1].split(" ")[0];
                document.getElementById('trophySub').innerText = `ဉာဏ်ကြီးရှင် ဥလေး ကွဲသွားပြီး ${pets[level-1]} ရရှိလိုက်ပါပြီ!`;
                document.getElementById('trophyModal').style.display = 'flex';
                playMyanmarWishSound(`ဟာ... ဉာဏ်ကြီးရှင် ဥလေး ကွဲပြီး ${pets[level-1]} ရသွားပါပြီ!`);
            }
        }

        function openStickerBook() {
            let grid = document.getElementById('stickerGrid');
            grid.innerHTML = "";
            stickerList.forEach(s => {
                let div = document.createElement('div');
                div.style.opacity = unlockedStickers.includes(s) ? "1" : "0.2";
                div.innerText = s;
                grid.appendChild(div);
            });
            document.getElementById('stickerModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function setMode(m) { mode = m; document.getElementById('cardInner').classList.remove('flipped'); document.getElementById('cardContent').innerText = '?'; currentItem = null; stopListening(); }
        function showSpeech(text) { const speech = document.getElementById('speechBubble'); speech.innerText = text; speech.style.display = 'block'; }
        function restartGame() { stopListening(); stars = 0; level = 1; wrongCount = 0; currentItem = null; unlockedStickers = []; document.getElementById('starCount').innerText = `⭐ 0`; document.getElementById('levelText').innerText = `🏆 Level: 1`; document.getElementById('cardInner').classList.remove('flipped'); document.getElementById('cardContent').innerText = '?'; document.getElementById('speechBubble').style.display = 'none'; document.getElementById('mediaBox').innerHTML = `<div class="accessory-overlay" id="accOverlay">${accessories[accIndex]}</div><img src="phway.jpg" alt="ဖွေးဖွေး">`; }
    </script>
</body>
</html>
