<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🦄</title>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- ResponsiveVoice SDK (API Key မလိုဘဲ မိန်းကလေးအသံ တိုက်ရိုက် ထွက်မည့် စနစ်) -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');

        * { box-sizing: border-box; font-family: 'Padauk', sans-serif; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #4facfe;
        }

        /* 🌈 Dynamic Background */
        body {
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; position: relative;
            background: linear-gradient(-45deg, #00c6ff, #0072ff, #38ef7d, #11998e);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            padding: 8px 5px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🎈 Floating Bubbles */
        .bubble {
            position: absolute; bottom: -50px; background: rgba(255, 255, 255, 0.25);
            border-radius: 50%; pointer-events: none; z-index: 1;
            animation: floatUp 8s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        /* 🔝 Top Nav Bar */
        .top-nav {
            width: 98%; max-width: 600px; padding: 6px 12px;
            background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(12px);
            border-radius: 20px; border: 2px solid rgba(255,255,255,0.8);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 10;
        }

        .title-text { font-size: 19px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .status-box { display: flex; justify-content: space-around; width: 100%; align-items: center; }
        
        .badge {
            background: #ffeaa7; padding: 3px 10px; border-radius: 20px;
            font-size: 14px; color: #d35400; border: 2px solid #f39c12; font-weight: bold;
            box-shadow: 0 3px 0 #e67e22;
        }

        .btn-restart {
            background: #ff7675; color: white; border: 2px solid #fff;
            padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: bold;
            cursor: pointer; box-shadow: 0 3px 0 #d63031;
        }

        .mode-box { display: flex; gap: 8px; }
        .btn-m {
            padding: 4px 10px; border-radius: 14px; font-size: 13px; font-weight: bold;
            color: white; border: 2px solid #fff; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }
        .bg-mm { background: #ff4757; }
        .bg-en { background: #2ed573; color: #2f3542; }
        .bg-num { background: #1e90ff; }

        /* 🎮 Main Display Area */
        .game-main {
            flex: 1; width: 100%; max-width: 500px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; z-index: 5;
            position: relative; margin: 5px 0;
        }

        .speech-bubble {
            position: absolute; top: -12px; background: #fff; color: #2d3436;
            padding: 6px 16px; border-radius: 20px; font-size: 15px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: none; z-index: 30; border: 2px solid #fdcb6e;
        }

        /* 🎥 Character Frame */
        .character-box {
            width: 88vw; height: 35vh; max-width: 380px; max-height: 260px;
            border-radius: 25px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .character-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 25px; }
        .character-box video { width: 100%; height: 100%; object-fit: contain; border-radius: 25px; }

        /* 🃏 Flash Card */
        .flash-card {
            width: 88vw; height: 20vh; max-width: 380px; max-height: 160px;
            background: linear-gradient(145deg, #ffffff, #fff3bf);
            border: 6px solid #f1c40f; border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; font-weight: bold; color: #e74c3c;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer; position: relative; transition: transform 0.15s;
        }
        .flash-card:active { transform: scale(0.95); }
        .sound-icon { position: absolute; bottom: 8px; right: 15px; font-size: 22px; color: #3498db; }

        .roll-anim { animation: magicRoll 0.35s ease-out; }
        @keyframes magicRoll {
            0% { transform: scale(0.2) rotate(-180deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* 🕹️ Controls */
        .bottom-controls {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 10;
        }

        .btn-draw {
            width: 92%; background: linear-gradient(180deg, #f1c40f 0%, #e67e22 100%);
            color: #fff; font-size: 22px; font-weight: bold; padding: 10px;
            border-radius: 50px; border: 3px solid #fff; cursor: pointer;
            box-shadow: 0 5px 0 #d35400, 0 8px 15px rgba(0,0,0,0.2); transition: 0.1s;
        }
        .btn-draw:active { transform: translateY(3px); box-shadow: 0 2px 0 #d35400; }

        .btn-mic {
            width: 92%; background: #e74c3c; color: white; font-size: 14px; font-weight: bold;
            padding: 7px; border-radius: 30px; border: 2px solid white; cursor: pointer;
            box-shadow: 0 4px 0 #c0392b; transition: 0.1s;
        }

        .eval-group { display: flex; gap: 10px; width: 92%; }
        .btn-eval {
            flex: 1; padding: 8px; font-size: 17px; font-weight: bold; color: white;
            border-radius: 20px; border: 2px solid white; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: 0.1s;
        }
        .btn-yes { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
        .btn-no { background: #ff7675; box-shadow: 0 4px 0 #d63031; }
    </style>
</head>
<body>

    <div class="bubble" style="left: 10%; width: 40px; height: 40px; animation-duration: 7s;"></div>
    <div class="bubble" style="left: 30%; width: 25px; height: 25px; animation-duration: 5s;"></div>
    <div class="bubble" style="left: 60%; width: 50px; height: 50px; animation-duration: 9s;"></div>
    <div class="bubble" style="left: 85%; width: 35px; height: 35px; animation-duration: 6s;"></div>

    <div class="top-nav">
        <h1 class="title-text">🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🦄</h1>
        <div class="status-box">
            <span class="badge" id="starCount">⭐ ကြယ်: 0</span>
            <span class="badge" id="levelText">Level: 1</span>
            <button class="btn-restart" onclick="restartGame()">🔄 Restart</button>
        </div>
        <div class="mode-box">
            <button class="btn-m bg-mm" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-en" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-num" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <div class="game-main">
        <div class="speech-bubble" id="speechBubble"></div>

        <div class="character-box" id="mediaBox">
            <img src="phway.jpg" alt="ဖွေးဖွေး">
        </div>

        <div class="flash-card" id="card" onclick="speakText(currentTarget)">
            ?
            <span class="sound-icon">🔊</span>
        </div>
    </div>

    <div class="bottom-controls">
        <button class="btn-draw" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>
        <button class="btn-mic" id="micBtn" onclick="speakText(currentTarget)">🎙️ အသံဖတ်ပြမယ် (နားထောင်)</button>
        <div class="eval-group">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
        </div>
    </div>

    <script>
        const levelsData = {
            myanmar: { 1: ["က","ခ","ဂ","ဃ","င"], 2: ["စ","ဆ","ဇ","ဈ","ည"], 3: ["တ","ထ","ဒ","ဓ","န"] },
            english: { 1: ["A","B","C","D","E"], 2: ["F","G","H","I","J"], 3: ["K","L","M","N","O"] },
            numbers: { 1: ["၁","၂","၃","၄","၅"], 2: ["၆","၇","၈","၉","၁၀"], 3: ["1","2","3","4","5"] }
        };

        let mode = 'myanmar';
        let level = 1;
        let stars = 0;
        let currentTarget = '';
        let wrongCount = 0;
        let wrongToggle = false;

        const card = document.getElementById('card');
        const mediaBox = document.getElementById('mediaBox');
        const starCount = document.getElementById('starCount');
        const speech = document.getElementById('speechBubble');

        // 🎙️ 100% တိုက်ရိုက် မိန်းကလေးအသံ ထွက်စေမည့် Cloud Voice Engine
        function speakVoice(text, pitchVal = 1.2, rateVal = 0.9) {
            if(!text || text === '?') return;

            // ResponsiveVoice သို့မဟုတ် Direct Online Audio Stream နည်းလမ်းဖြင့် မိန်းကလေးအသံ ဖတ်ပြမည်
            if (window.responsiveVoice) {
                responsiveVoice.cancel();
                // Burmese သို့မဟုတ် English Female Voice ကို သုံးမည်
                const voiceName = mode === 'english' ? "US English Female" : "Thai Female"; 
                responsiveVoice.speak(text, voiceName, { pitch: pitchVal, rate: rateVal });
            } else {
                // Fallback: Online Translate TTS Stream
                const lang = mode === 'english' ? 'en' : 'my';
                const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`);
                audio.play();
            }
        }

        function speakText(text) {
            speakVoice(text, 1.1, 0.85);
        }

        function assess(isCorrect) {
            speech.style.display = 'none';

            if (isCorrect) {
                wrongCount = 0;
                stars += 1;
                starCount.innerText = `⭐ ကြယ်: ${stars}`;
                
                const msg = "ဖွေးဖွေးလေးက တော်လိုက်တာ";
                showSpeech(`💃 ${msg}! 🎉`);
                speakVoice(msg, 1.3, 0.9); // ချိုသာနူးညံ့သည့် မိန်းကလေးအသံ

                mediaBox.innerHTML = `<video src="dance.mp4" autoplay loop muted playsinline></video>`;
                if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });

            } else {
                wrongCount += 1;
                let msg = "";

                if (wrongCount >= 3) {
                    msg = "ဖွေးဖွေး မှားပဲ မှားနေတာ စိတ်တိုလာပြီနော်";
                    speakVoice(msg, 0.8, 1.0); // စိတ်တိုသည့် ခပ်မာမာအသံ
                } else {
                    msg = "ဖွေးဖွေး မှားနေပြီနော်";
                    speakVoice(msg, 1.0, 0.9); // သတိပေးသည့် မိန်းကလေးအသံ
                }

                showSpeech(`😭 ${msg}`);
                wrongToggle = !wrongToggle;
                const imgName = wrongToggle ? 'worng1.jpg' : 'worng2.jpg';
                mediaBox.innerHTML = `<img src="${imgName}" alt="Wrong Response">`;
            }
        }

        function drawCard() {
            card.classList.remove('roll-anim');
            void card.offsetWidth;
            card.classList.add('roll-anim');

            const pool = levelsData[mode][level];
            currentTarget = pool[Math.floor(Math.random() * pool.length)];
            card.innerHTML = `${currentTarget}<span class="sound-icon">🔊</span>`;
            
            setTimeout(() => { speakText(currentTarget); }, 200);
        }

        function setMode(m) { 
            mode = m; level = 1; 
            card.innerHTML = `?<span class="sound-icon">🔊</span>`; 
            currentTarget = ''; 
        }

        function showSpeech(text) { speech.innerText = text; speech.style.display = 'block'; }

        function restartGame() { 
            stars = 0; level = 1; wrongCount = 0; currentTarget = ''; 
            starCount.innerText = `⭐ ကြယ်: 0`; 
            card.innerHTML = `?<span class="sound-icon">🔊</span>`; 
            speech.style.display = 'none'; 
            mediaBox.innerHTML = `<img src="phway.jpg" alt="ဖွေးဖွေး">`;
        }
    </script>
</body>
</html>
