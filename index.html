<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🎈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Pyidaungsu', sans-serif;
            margin: 0;
            padding: 0;
            /* Cartoon World Theme Background */
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 40%, #a8e063 40%, #56ab2f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            user-select: none;
        }

        /* Top Bar & Level Header */
        .top-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border-bottom: 5px solid #fffa65;
        }

        .title {
            font-size: 22px;
            color: #ff3838;
            margin: 0 0 8px 0;
            text-shadow: 1px 1px 2px #fff;
        }

        .level-badge {
            background: #ff9f1a;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        /* Mode Buttons */
        .mode-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-m {
            padding: 8px 14px;
            border: 3px solid white;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .bg-myanmar { background: #ff4d4d; }
        .bg-english { background: #32ff7e; color: #1e272e; }
        .bg-numbers { background: #18dcff; color: #1e272e; }

        /* Traveling Cartoon Map */
        .travel-path {
            font-size: 36px;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.4);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Flashcard Area */
        .card-container {
            position: relative;
            perspective: 1000px;
        }

        .card-box {
            width: 220px;
            height: 220px;
            background: #ffffff;
            border: 10px solid #ffaf40;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 110px;
            font-weight: bold;
            color: #ff3838;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .card-box.rolling {
            animation: rollCard 0.1s infinite;
        }

        @keyframes rollCard {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(6deg); }
            100% { transform: scale(1) rotate(-6deg); }
        }

        /* Control & Action Buttons */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }

        .draw-btn {
            background: linear-gradient(180deg, #fffa65 0%, #ffaf40 100%);
            border: 4px solid #fff;
            color: #cd6133;
            font-size: 26px;
            font-weight: bold;
            padding: 14px 45px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #c77d11, 0 12px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .draw-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #c77d11;
        }

        .eval-group {
            display: flex;
            gap: 15px;
        }

        .btn-eval {
            padding: 12px 22px;
            font-size: 18px;
            border: 3px solid white;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        .btn-yes { background: #32ff7e; color: #1e272e; }
        .btn-no { background: #ff3838; }

        /* Speech Bubble Message */
        .speech-bubble {
            position: absolute;
            top: -45px;
            background: #fff;
            color: #2c3e50;
            padding: 6px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1 class="title">🚀 ဖွေးဖွေးလေးရဲ့ စာသင်ခရီးစဉ် 🦄</h1>
        <div class="level-badge" id="levelText">Level: 1 (အစပျိုး ခရီးစဉ်)</div>
        
        <div class="mode-group">
            <button class="btn-m bg-myanmar" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-english" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-numbers" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <!-- Traveling Visual Path -->
    <div class="travel-path" id="mapVisual">🏰 ➔ 🐯 ➔ 🐥 ➔ 🎈</div>

    <!-- Flashcard Display -->
    <div class="card-container">
        <div class="speech-bubble" id="speechBubble"></div>
        <div class="card-box" id="card">?</div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="draw-btn" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>

        <div class="eval-group">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">💪 ကြိုးစားပါ</button>
        </div>
    </div>

    <script>
        // Levels Dataset
        const levelsData = {
            myanmar: {
                1: ["က","ခ","ဂ","ဃ","င"],
                2: ["စ","ဆ","ဇ","ဈ","ည","ဋ","ဌ","ဍ","ဎ","ဏ"],
                3: ["တ","ထ","ဒ","ဓ","န","ပ","ဖ","ဗ","ဘ","မ","ယ","ရ","လ","ဝ","သ","ဟ","ဠ","အ"]
            },
            english: {
                1: ["A","B","C","D","E","F","G"],
                2: ["H","I","J","K","L","M","N","O","P"],
                3: ["Q","R","S","T","U","V","W","X","Y","Z"]
            },
            numbers: {
                1: ["၁","၂","၃","၄","၅","1","2","3","4","5"],
                2: ["၆","၇","၈","၉","၁၀","6","7","8","9","10"],
                3: ["၁၁","၁၂","၁၃","၁၄","၁၅","11","12","13","14","15"]
            }
        };

        const maps = [
            "🏰 ➔ 🐯 ➔ 🐥 ➔ 🎈",
            "🚀 ➔ 🌙 ➔ ⭐ ➔ 🪐",
            "🎪 ➔ 🦁 ➔ 🐘 ➔ 🎡"
        ];

        let mode = 'myanmar';
        let level = 1;
        let score = 0;

        const card = document.getElementById('card');
        const levelText = document.getElementById('levelText');
        const mapVisual = document.getElementById('mapVisual');
        const speech = document.getElementById('speechBubble');

        // Web Audio Synthesizer (၁၀၀% ဖုန်းတိုင်းမှာ အသံထွက်စေသော စနစ်)
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playKidSound(type) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();

            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain);
            gain.connect(AudioCtx.destination);

            const now = AudioCtx.currentTime;

            if (type === 'spin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'correct') {
                // Happy Tune (C-E-G)
                playNote(523.25, now, 0.1);
                playNote(659.25, now + 0.1, 0.1);
                playNote(783.99, now + 0.2, 0.3);
            } else if (type === 'wrong') {
                // Try Again Melancholy Tone
                playNote(400, now, 0.15);
                playNote(300, now + 0.15, 0.3);
            }
        }

        function playNote(freq, time, duration) {
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain);
            gain.connect(AudioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.linearRampToValueAtTime(0.01, time + duration);
            osc.start(time);
            osc.stop(time + duration);
        }

        function showSpeech(text) {
            speech.innerText = text;
            speech.style.display = 'block';
            setTimeout(() => { speech.style.display = 'none'; }, 2000);
        }

        function setMode(newMode) {
            mode = newMode;
            level = 1;
            score = 0;
            updateUI();
            card.innerText = '?';
            playKidSound('spin');
        }

        function getPool() {
            let pool = [];
            for (let i = 1; i <= level; i++) {
                pool = pool.concat(levelsData[mode][i]);
            }
            return pool;
        }

        function drawCard() {
            card.classList.add('rolling');
            const pool = getPool();
            let count = 0;

            const interval = setInterval(() => {
                card.innerText = pool[Math.floor(Math.random() * pool.length)];
                playKidSound('spin');
                count++;

                if (count > 12) {
                    clearInterval(interval);
                    card.classList.remove('rolling');
                    const selected = pool[Math.floor(Math.random() * pool.length)];
                    card.innerText = selected;
                }
            }, 70);
        }

        function assess(isCorrect) {
            if (isCorrect) {
                playKidSound('correct');
                showSpeech("✨ တော်လိုက်တာ ဖွေးဖွေးလေးက! 🎉");
                score++;

                if (score >= 3 && level < 3) {
                    level++;
                    score = 0;
                    setTimeout(() => {
                        alert("🎉 ဂုဏ်ယူပါတယ်ဖွေးဖွေးလေးရေ! Level " + level + " သို့ တက်ရောက်သွားပါပြီ!");
                        updateUI();
                    }, 400);
                }
            } else {
                playKidSound('wrong');
                showSpeech("💪 ကြိုးစားပါအုန်း ဖွေးဖွေးလေးရေ!");
            }
        }

        function updateUI() {
            levelText.innerText = `Level: ${level} (${mode === 'myanmar' ? 'မြန်မာ' : mode === 'english' ? 'English' : 'ဂဏန်း'})`;
            mapVisual.innerText = maps[(level - 1) % maps.length];
        }
    </script>
</body>
</html>
