<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🦄</title>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');

        * { box-sizing: border-box; font-family: 'Padauk', sans-serif; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #4facfe;
        }

        body {
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; position: relative;
            background: linear-gradient(180deg, #38ef7d 0%, #11998e 100%);
        }

        /* 🌳 Sky Background Animation */
        .sky-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
            z-index: 0;
        }

        .sun-bright {
            position: absolute; top: 15px; right: 20px; width: 70px; height: 70px;
            background: #f1c40f; border-radius: 50%; box-shadow: 0 0 40px #f39c12;
            animation: sunPulse 2s infinite alternate;
        }
        @keyframes sunPulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.1); } }

        /* 🔝 Top Nav */
        .top-nav {
            width: 95%; max-width: 600px; margin-top: 10px; padding: 10px;
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
            border-radius: 25px; border: 3px solid rgba(255,255,255,0.6);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 10;
        }

        .title-text { font-size: 22px; color: #fff; text-shadow: 2px 2px 0 #d63031; }

        .status-box { display: flex; justify-content: space-around; width: 100%; align-items: center; }
        
        .badge {
            background: #ffeaa7; padding: 4px 14px; border-radius: 20px;
            font-size: 16px; color: #d35400; border: 3px solid #f39c12; font-weight: bold;
            box-shadow: 0 4px 0 #e67e22;
        }

        .btn-restart {
            background: #ff7675; color: white; border: 2px solid #fff;
            padding: 4px 14px; border-radius: 20px; font-size: 15px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 0 #d63031;
        }
        .btn-restart:active { transform: translateY(3px); box-shadow: none; }

        .mode-box { display: flex; gap: 8px; }
        .btn-m {
            padding: 6px 14px; border-radius: 16px; font-size: 15px; font-weight: bold;
            color: white; border: 2px solid #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .bg-mm { background: #ff4757; }
        .bg-en { background: #2ed573; color: #2f3542; }
        .bg-num { background: #1e90ff; }

        /* 🎮 Main Display Area */
        .game-main {
            flex: 1; width: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 5; position: relative;
        }

        .speech-bubble {
            position: absolute; top: -15px; background: #fff; color: #2d3436;
            padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; z-index: 30;
        }

        /* 🎥 Character Container (SVG, Image, Video) */
        .character-box {
            width: 180px; height: 180px; margin-bottom: 10px;
            border-radius: 25px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); background: #fff;
        }

        .character-box img, .character-box video {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* 🃏 Flash Card */
        .flash-card {
            width: 170px; height: 170px;
            background: linear-gradient(145deg, #ffffff, #ffeaa7);
            border: 8px solid #f1c40f; border-radius: 35px;
            display: flex; align-items: center; justify-content: center;
            font-size: 90px; font-weight: bold; color: #e74c3c;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            cursor: pointer; position: relative; transition: transform 0.2s;
        }
        .flash-card:active { transform: scale(0.92); }
        .sound-icon { position: absolute; bottom: 8px; right: 12px; font-size: 20px; color: #3498db; }

        .roll-anim { animation: magicRoll 0.4s ease-out; }
        @keyframes magicRoll {
            0% { transform: scale(0.1) rotate(-360deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* 🕹️ Controls */
        .bottom-controls {
            width: 100%; max-width: 450px; padding: 12px;
            display: flex; flex-direction: column; gap: 10px; align-items: center;
            z-index: 10; margin-bottom: 10px;
        }

        .btn-draw {
            width: 90%; background: linear-gradient(180deg, #f1c40f 0%, #e67e22 100%);
            color: #fff; font-size: 24px; font-weight: bold; padding: 12px;
            border-radius: 50px; border: 4px solid #fff; cursor: pointer;
            box-shadow: 0 6px 0 #d35400, 0 8px 20px rgba(0,0,0,0.3); transition: 0.1s;
        }
        .btn-draw:active { transform: translateY(4px); box-shadow: 0 2px 0 #d35400; }

        .btn-mic {
            width: 90%; background: #e74c3c; color: white; font-size: 16px; font-weight: bold;
            padding: 10px; border-radius: 30px; border: 3px solid white; cursor: pointer;
            box-shadow: 0 5px 0 #c0392b; transition: 0.1s;
        }

        .eval-group { display: flex; gap: 12px; width: 90%; }
        .btn-eval {
            flex: 1; padding: 10px; font-size: 18px; font-weight: bold; color: white;
            border-radius: 25px; border: 3px solid white; cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3); transition: 0.1s;
        }
        .btn-yes { background: #2ecc71; box-shadow: 0 5px 0 #27ae60; }
        .btn-no { background: #ff7675; box-shadow: 0 5px 0 #d63031; }
    </style>
</head>
<body>

    <div class="sky-bg">
        <div class="sun-bright"></div>
    </div>

    <div class="top-nav">
        <h1 class="title-text">🎈 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🦄</h1>
        <div class="status-box">
            <span class="badge" id="starCount">⭐ ကြယ်: 0</span>
            <span class="badge" id="levelText">Level: 1</span>
            <button class="btn-restart" onclick="restartGame()">🔄 Restart</button>
        </div>
        <div class="mode-box">
            <button class="btn-m bg-mm" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-m bg-en" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-m bg-num" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <div class="game-main">
        <div class="speech-bubble" id="speechBubble"></div>

        <!-- 🎥 Dynamic Media Frame -->
        <div class="character-box" id="mediaBox">
            <!-- Default Cartoon SVG -->
            <svg viewBox="0 0 100 120" style="width:100%; height:100%;">
                <circle cx="50" cy="40" r="25" fill="#ffdfba"/>
                <circle cx="40" cy="38" r="3.5" fill="#2d3436"/>
                <circle cx="60" cy="38" r="3.5" fill="#2d3436"/>
                <path d="M42,46 Q50,54 58,46" fill="none" stroke="#d63031" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M35,65 L65,65 L75,100 L25,100 Z" fill="#ff7675"/>
            </svg>
        </div>

        <div class="flash-card" id="card" onclick="speakCurrentCard()">
            ?
            <span class="sound-icon">🔊</span>
        </div>
    </div>

    <div class="bottom-controls">
        <button class="btn-draw" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>
        <button class="btn-mic" id="micBtn" onclick="startListening()">🎙️ အသံဖတ်ပြမယ် (နားထောင်)</button>
        <div class="eval-group">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
        </div>
    </div>

    <script>
        const levelsData = {
            myanmar: { 1: ["က","ခ","ဂ","ဃ","င"], 2: ["စ","ဆ","ဇ","ဈ","ည"], 3: ["တ","ထ","ဒ","ဓ","န"] },
            english: { 1: ["A","B","C","D","E"], 2: ["F","G","H","I","J"], 3: ["K","L","M","N","O"] },
            numbers: { 1: ["၁","၂","၃","၄","၅"], 2: ["၆","၇","၈","၉","၁၀"], 3: ["1","2","3","4","5"] }
        };

        let mode = 'myanmar';
        let level = 1;
        let stars = 0;
        let currentTarget = '';
        let wrongToggle = false;

        const card = document.getElementById('card');
        const mediaBox = document.getElementById('mediaBox');
        const starCount = document.getElementById('starCount');
        const speech = document.getElementById('speechBubble');

        function playMagicDrawSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                const freqs = [329.63, 392.00, 493.88, 587.33, 659.25, 783.99, 987.77];
                freqs.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.04);
                    gain.gain.setValueAtTime(0.2, now + index * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.04 + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + index * 0.04);
                    osc.stop(now + index * 0.04 + 0.2);
                });
            } catch(e) {}
        }

        function assess(isCorrect) {
            speech.style.display = 'none';
            if (isCorrect) {
                stars += 1;
                starCount.innerText = `⭐ ကြယ်: ${stars}`;
                showSpeech("💃 ဟေး... မှန်သွားပြီ! 🎉");
                // 🎬 Show Dancing Video
                mediaBox.innerHTML = `<video src="dance.mp4" autoplay loop muted playsinline></video>`;
                if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
            } else {
                showSpeech("😭 မှားသွားတယ်နော် ကြိုးစားပါ~");
                // 🖼️ Alternate between wrong1.jpg & wrong2.jpg
                wrongToggle = !wrongToggle;
                const imgName = wrongToggle ? 'wrong1.jpg' : 'wrong2.jpg';
                mediaBox.innerHTML = `<img src="${imgName}" alt="Wrong Response">`;
            }
        }

        function drawCard() {
            playMagicDrawSound();
            card.classList.remove('roll-anim');
            void card.offsetWidth;
            card.classList.add('roll-anim');

            const pool = levelsData[mode][level];
            currentTarget = pool[Math.floor(Math.random() * pool.length)];
            card.innerHTML = `${currentTarget}<span class="sound-icon">🔊</span>`;
            setTimeout(() => { speakCurrentCard(); }, 300);
        }

        function speakCurrentCard() {
            if (!currentTarget || currentTarget === '?') return;
            const utterance = new SpeechSynthesisUtterance(currentTarget);
            utterance.lang = mode === 'english' ? 'en-US' : 'my-MM';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function setMode(m) {
            mode = m; level = 1;
            card.innerHTML = `?<span class="sound-icon">🔊</span>`;
            currentTarget = '';
        }

        function showSpeech(text) {
            speech.innerText = text;
            speech.style.display = 'block';
        }

        function restartGame() {
            stars = 0; level = 1; currentTarget = '';
            starCount.innerText = `⭐ ကြယ်: 0`;
            card.innerHTML = `?<span class="sound-icon">🔊</span>`;
            speech.style.display = 'none';
        }
    </script>
</body>
</html>
