<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်းကမ္ဘာ 🎈</title>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');

        * { box-sizing: border-box; font-family: 'Padauk', sans-serif; }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            user-select: none; overflow-x: hidden; position: relative;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 40%, #38ef7d 100%);
        }

        /* 🌳 Animated Forest Background */
        .bg-animated {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }

        .sun {
            position: absolute; top: 20px; right: 20px; width: 70px; height: 70px;
            background: #f1c40f; border-radius: 50%; box-shadow: 0 0 40px #f39c12;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); box-shadow: 0 0 60px #f1c40f; }
        }

        .cloud {
            position: absolute; background: rgba(255, 255, 255, 0.9);
            border-radius: 50px; animation: floatCloud 20s linear infinite;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); border-radius: 50%;
        }
        .c1 { width: 100px; height: 35px; top: 12%; left: -120px; }
        .c1::before { width: 45px; height: 45px; top: -18px; left: 15px; }
        .c1::after { width: 35px; height: 35px; top: -12px; left: 45px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(110vw); }
        }

        .hills {
            position: absolute; bottom: 0; width: 100%; height: 25vh;
        }

        /* Top Bar & Score Panel */
        .top-bar {
            width: 100%; max-width: 500px; padding: 10px 15px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px);
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 10;
        }

        .game-title {
            font-size: 20px; font-weight: bold; color: #d63031;
            text-shadow: 2px 2px 0px #fff; margin: 0;
        }

        .status-row {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 0 10px;
        }

        .badge {
            background: #ffeaa7; padding: 4px 12px; border-radius: 20px;
            font-size: 16px; font-weight: bold; color: #e67e22; border: 2px solid #f39c12;
            box-shadow: 0 4px 0 #d35400;
        }

        .btn-restart {
            background: #ff7675; color: white; border: 2px solid white;
            padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 0 #d63031; transition: 0.1s;
        }
        .btn-restart:active { transform: translateY(3px); box-shadow: none; }

        .mode-row { display: flex; gap: 8px; }
        .btn-mode {
            padding: 6px 14px; border-radius: 15px; font-size: 14px; font-weight: bold;
            color: white; border: 2px solid #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .m-myanmar { background: #ff4757; }
        .m-english { background: #2ed573; color: #2f3542; }
        .m-numbers { background: #1e90ff; }

        /* Game Area Layout */
        .game-body {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; width: 100%; max-width: 400px; margin-top: 10px;
            position: relative;
        }

        .speech-bubble {
            position: absolute; top: -20px; background: #ffffff; color: #2d3436;
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: none; z-index: 20;
            animation: bounce 0.5s infinite alternate;
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        /* 👧 Cartoon Avatar (Full Size Character) */
        .phway-character {
            width: 160px; height: 180px; position: relative; margin-bottom: 5px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); transition: transform 0.3s;
        }
        .phway-character svg { width: 100%; height: 100%; }

        .dance { animation: fullDance 0.5s infinite alternate ease-in-out; }
        @keyframes fullDance {
            0% { transform: translateY(0) rotate(-10deg) scale(1.05); }
            100% { transform: translateY(-20px) rotate(10deg) scale(1.1); }
        }

        .cry { animation: fullCry 0.2s infinite alternate; filter: grayscale(50%); }
        @keyframes fullCry { 0% { transform: translateX(-8px); } 100% { transform: translateX(8px); } }

        /* 🃏 Flash Card (3D Glossy Box) */
        .flash-card {
            width: 170px; height: 170px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border: 8px solid #f1c40f; border-radius: 35px;
            display: flex; align-items: center; justify-content: center;
            font-size: 85px; font-weight: bold; color: #e74c3c;
            box-shadow: 0 12px 25px rgba(0,0,0,0.25), inset 0 5px 10px rgba(255,255,255,0.8);
            cursor: pointer; position: relative; transition: transform 0.2s;
        }
        .flash-card:active { transform: scale(0.95); }
        .sound-icon { position: absolute; bottom: 8px; right: 12px; font-size: 18px; color: #3498db; }

        /* Controls Section */
        .controls-area {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            width: 100%; max-width: 350px; margin-bottom: 20px; z-index: 10;
        }

        .btn-draw {
            width: 80%; background: linear-gradient(180deg, #f1c40f 0%, #e67e22 100%);
            color: #fff; font-size: 22px; font-weight: bold; padding: 12px;
            border-radius: 50px; border: 3px solid #fff; cursor: pointer;
            box-shadow: 0 6px 0 #d35400, 0 10px 20px rgba(0,0,0,0.2);
            text-shadow: 1px 2px 3px rgba(0,0,0,0.3); transition: 0.1s;
        }
        .btn-draw:active { transform: translateY(4px); box-shadow: 0 2px 0 #d35400; }

        .btn-mic {
            width: 80%; background: #e74c3c; color: white; font-size: 16px; font-weight: bold;
            padding: 10px; border-radius: 30px; border: 3px solid white; cursor: pointer;
            box-shadow: 0 5px 0 #c0392b, 0 8px 15px rgba(0,0,0,0.2); transition: 0.1s;
        }
        .btn-mic:active { transform: translateY(3px); box-shadow: 0 2px 0 #c0392b; }

        .eval-btns { display: flex; gap: 15px; width: 80%; }
        .btn-eval {
            flex: 1; padding: 10px; font-size: 18px; font-weight: bold; color: white;
            border-radius: 25px; border: 3px solid white; cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2); transition: 0.1s;
        }
        .btn-yes { background: #2ecc71; box-shadow: 0 5px 0 #27ae60; }
        .btn-yes:active { transform: translateY(3px); box-shadow: none; }
        .btn-no { background: #ff7675; box-shadow: 0 5px 0 #d63031; }
        .btn-no:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

    <!-- 🌳 Animated Background -->
    <div class="bg-animated">
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#2ecc71" opacity="0.8" d="M0,192L60,181.3C120,171,240,149,360,165.3C480,181,600,235,720,229.3C840,224,960,160,1080,138.7C1200,117,1320,139,1380,149.3L1440,160L1440,320L0,320Z"></path>
            <path fill="#27ae60" opacity="0.9" d="M0,224L80,208C160,192,320,160,480,176C640,192,800,256,960,256C1120,256,1280,192,1360,160L1440,128L1440,320L0,320Z"></path>
        </svg>
    </div>

    <!-- 🔝 Top Bar -->
    <div class="top-bar">
        <h1 class="game-title">🦄 ဖွေးဖွေးလေးရဲ့ စာသင်ဂိမ်း 🎈</h1>
        <div class="status-row">
            <span class="badge" id="starCount">⭐ ကြယ်: 0</span>
            <span class="badge" id="levelText">Level: 1</span>
            <button class="btn-restart" onclick="restartGame()">🔄 Restart</button>
        </div>
        <div class="mode-row">
            <button class="btn-mode m-myanmar" onclick="setMode('myanmar')">🇲🇲 မြန်မာ</button>
            <button class="btn-mode m-english" onclick="setMode('english')">🔤 ABC</button>
            <button class="btn-mode m-numbers" onclick="setMode('numbers')">🔢 ဂဏန်း</button>
        </div>
    </div>

    <!-- 🎮 Game Area -->
    <div class="game-body">
        <div class="speech-bubble" id="speechBubble"></div>

        <!-- 👧 Full Cartoon Avatar -->
        <div class="phway-character" id="avatarBox">
            <svg viewBox="0 0 100 120">
                <!-- Hair Back -->
                <path d="M15,35 C5,55 10,100 30,105 C35,90 25,55 25,40 Z" fill="#2d3436"/>
                <path d="M85,35 C95,55 90,100 70,105 C65,90 75,55 75,40 Z" fill="#2d3436"/>
                <!-- Dress -->
                <path d="M35,65 L65,65 L75,100 L25,100 Z" fill="#ff7675"/>
                <!-- Arms -->
                <path d="M25,68 C15,75 15,85 22,90" fill="none" stroke="#ffdfba" stroke-width="5" stroke-linecap="round"/>
                <path d="M75,68 C85,75 85,85 78,90" fill="none" stroke="#ffdfba" stroke-width="5" stroke-linecap="round"/>
                <!-- Face -->
                <circle cx="50" cy="40" r="25" fill="#ffdfba"/>
                <!-- Hair Top -->
                <path d="M25,35 C28,15 72,15 75,35 C68,22 32,22 25,35 Z" fill="#2d3436"/>
                <!-- Bow -->
                <path d="M40,15 C35,8 45,10 50,15 C55,10 65,8 60,15 Z" fill="#f1c40f"/>
                <circle cx="50" cy="15" r="2.5" fill="#e67e22"/>
                <!-- Eyes -->
                <circle cx="40" cy="38" r="3" fill="#2d3436"/>
                <circle cx="60" cy="38" r="3" fill="#2d3436"/>
                <!-- Cheeks -->
                <ellipse cx="34" cy="43" rx="3.5" ry="1.8" fill="#ff7675" opacity="0.6"/>
                <ellipse cx="66" cy="43" rx="3.5" ry="1.8" fill="#ff7675" opacity="0.6"/>
                <!-- Smile -->
                <path d="M43,46 Q50,53 57,46" fill="none" stroke="#d63031" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- 🃏 Card -->
        <div class="flash-card" id="card" onclick="speakCurrentCard()">
            ?
            <span class="sound-icon">🔊</span>
        </div>
    </div>

    <!-- 🕹️ Controls -->
    <div class="controls-area">
        <button class="btn-draw" onclick="drawCard()">🎲 မဲနှိုက်မယ်</button>
        <button class="btn-mic" id="micBtn" onclick="startListening()">🎙️ အသံဖတ်ပြမယ် (နားထောင်)</button>
        <div class="eval-btns">
            <button class="btn-eval btn-yes" onclick="assess(true)">🎉 မှန်တယ်</button>
            <button class="btn-eval btn-no" onclick="assess(false)">😭 မှားတယ်</button>
        </div>
    </div>

    <script>
        const levelsData = {
            myanmar: { 1: ["က","ခ","ဂ","ဃ","င"], 2: ["စ","ဆ","ဇ","ဈ","ည"], 3: ["တ","ထ","ဒ","ဓ","န"] },
            english: { 1: ["A","B","C","D","E"], 2: ["F","G","H","I","J"], 3: ["K","L","M","N","O"] },
            numbers: { 1: ["၁","၂","၃","၄","၅"], 2: ["၆","၇","၈","၉","၁၀"], 3: ["1","2","3","4","5"] }
        };

        let mode = 'myanmar';
        let level = 1;
        let stars = 0;
        let currentTarget = '';

        const card = document.getElementById('card');
        const levelText = document.getElementById('levelText');
        const starCount = document.getElementById('starCount');
        const speech = document.getElementById('speechBubble');
        const avatarBox = document.getElementById('avatarBox');

        function restartGame() {
            stars = 0; level = 1; currentTarget = '';
            starCount.innerText = `⭐ ကြယ်: 0`;
            levelText.innerText = `Level: 1`;
            card.innerHTML = `?<span class="sound-icon">🔊</span>`;
            resetAvatar();
            showSpeech("🔄 အသစ်ပြန်စပါပြီဗျာ!");
        }

        function speakCurrentCard() {
            if (!currentTarget || currentTarget === '?') return;
            const utterance = new SpeechSynthesisUtterance(currentTarget);
            utterance.lang = mode === 'english' ? 'en-US' : 'my-MM';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function setMode(m) {
            mode = m; level = 1;
            levelText.innerText = `Level: 1`;
            card.innerHTML = `?<span class="sound-icon">🔊</span>`;
            currentTarget = '';
            resetAvatar();
        }

        function drawCard() {
            resetAvatar();
            const pool = levelsData[mode][level];
            currentTarget = pool[Math.floor(Math.random() * pool.length)];
            card.innerHTML = `${currentTarget}<span class="sound-icon">🔊</span>`;
            speakCurrentCard();
        }

        function assess(isCorrect) {
            resetAvatar();
            if (isCorrect) {
                stars += 1;
                starCount.innerText = `⭐ ကြယ်: ${stars}`;
                avatarBox.classList.add('dance');
                showSpeech("💃 တော်လိုက်တာ ဖွေးဖွေးလေးက! 🎉");
                if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
            } else {
                avatarBox.classList.add('cry');
                showSpeech("😭 ကြိုးစားပါအုန်း ဖွေးဖွေးလေးရေ~");
            }
        }

        function resetAvatar() {
            avatarBox.classList.remove('dance', 'cry');
            speech.style.display = 'none';
        }

        function showSpeech(text) {
            speech.innerText = text;
            speech.style.display = 'block';
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Microphone ကို ခွင့်ပြုပေးပါဗျာ!");
            const recognition = new SpeechRecognition();
            recognition.lang = mode === 'english' ? 'en-US' : 'my-MM';
            document.getElementById('micBtn').innerText = "🎧 နားထောင်နေပါတယ်...";
            recognition.start();

            recognition.onresult = function(e) {
                document.getElementById('micBtn').innerText = "🎙️ အသံဖတ်ပြမယ် (နားထောင်)";
                const spoken = e.results[0][0].transcript.trim();
                if (!currentTarget || currentTarget === '?') return showSpeech("မဲ အရင်နှိုက်ပေးပါနော်! 🎲");
                assess(spoken.toLowerCase().includes(currentTarget.toLowerCase()));
            };
            recognition.onerror = function() {
                document.getElementById('micBtn').innerText = "🎙️ အသံဖတ်ပြမယ် (နားထောင်)";
            };
        }
    </script>
</body>
</html>
